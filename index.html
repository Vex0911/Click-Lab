<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Click Lab</title>
  <style>
    :root {
      --bg: #0b1220;
      --bg-2: #111b2f;
      --panel: rgba(18, 28, 42, 0.92);
      --panel-alt: rgba(25, 36, 52, 0.96);
      --panel-strong: rgba(13, 18, 29, 0.98);
      --line: rgba(148, 163, 184, 0.18);
      --line-strong: rgba(96, 165, 250, 0.38);
      --text: #e5eefb;
      --muted: #8ea3be;
      --accent: #56d3ff;
      --accent-2: #7ef4b4;
      --warning: #ffb454;
      --danger: #ff667a;
      --shadow: rgba(0, 0, 0, 0.38);
      --bright: #dff7ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(86, 211, 255, 0.08), transparent 28%),
        linear-gradient(180deg, #09111d, var(--bg));
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .game {
      width: min(880px, 94vw);
      background: rgba(10, 16, 27, 0.7);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 20px 48px var(--shadow);
      padding: 18px;
      backdrop-filter: blur(5px);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      padding: 8px 8px 18px;
    }

    .title-block {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .site-mark {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 16px rgba(86, 211, 255, 0.8);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 2.8rem);
      letter-spacing: 0.04em;
      font-weight: 800;
    }

    .status {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .badge {
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      color: var(--bright);
      font-weight: 700;
      letter-spacing: 0.04em;
      font-size: 0.9rem;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 18px;
    }

    .panel {
      background: linear-gradient(180deg, rgba(17, 27, 41, 0.9), rgba(12, 18, 30, 0.95));
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      min-height: 100%;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .panel-head h2 {
      margin: 0;
      font-size: 1.3rem;
      letter-spacing: 0.04em;
    }

    .muted {
      color: var(--muted);
    }

    .notice {
      background: rgba(86, 211, 255, 0.08);
      border: 1px solid rgba(86, 211, 255, 0.2);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--bright);
      font-size: 0.92rem;
    }

    .click-area {
      display: grid;
      place-items: center;
      min-height: 300px;
      background:
        radial-gradient(circle at center, rgba(86, 211, 255, 0.10), transparent 34%),
        linear-gradient(135deg, rgba(17, 44, 62, 0.7), rgba(14, 22, 36, 0.9));
      border: 1px solid var(--line-strong);
      border-radius: 18px;
      margin: 10px 0 16px;
      box-shadow: inset 0 0 30px rgba(86, 211, 255, 0.06);
    }

    .main-button {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 1px solid rgba(126, 244, 180, 0.8);
      background: linear-gradient(145deg, #b8f9ff, #67d4ff 30%, #7ef4b4 100%);
      color: #062333;
      font-weight: 900;
      font-size: 1.7rem;
      letter-spacing: 0.03em;
      cursor: pointer;
      box-shadow: 0 14px 28px rgba(86, 211, 255, 0.24), inset 0 4px 14px rgba(255,255,255,0.4);
      transition: transform 0.08s ease, box-shadow 0.12s ease;
    }

    .main-button:hover {
      transform: translateY(-2px) scale(1.015);
      box-shadow: 0 18px 30px rgba(86, 211, 255, 0.28), inset 0 4px 14px rgba(255,255,255,0.45);
    }

    .main-button:active {
      transform: scale(0.96);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(120px, 1fr));
      gap: 12px;
    }

    .stat {
      background: rgba(10, 15, 25, 0.86);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      min-height: 88px;
    }

    .stat-label {
      font-size: 0.74rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .stat-value {
      margin-top: 10px;
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--bright);
    }

    .shop h2, .info h2 {
      margin: 0 0 12px;
      font-size: 1.2rem;
      letter-spacing: 0.04em;
    }

    .shop-item, .info-box {
      background: rgba(10, 15, 25, 0.9);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .shop-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .shop-item h3 {
      margin: 0 0 6px;
      font-size: 1rem;
      color: var(--bright);
    }

    .shop-item p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    button.buy, button.reset {
      border: none;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 10px 14px;
      cursor: pointer;
      color: #06141d;
      transition: filter 0.12s ease, transform 0.08s ease;
    }

    button.buy:hover, button.reset:hover {
      filter: brightness(1.04);
    }

    button.buy:active, button.reset:active {
      transform: translateY(1px);
    }

    .buy {
      background: linear-gradient(135deg, var(--warning), #f59e0b);
    }

    button.buy:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      filter: none;
    }

    .reset {
      background: linear-gradient(135deg, var(--danger), #c03945);
      color: white;
      width: 100%;
      margin-top: 14px;
    }

    .info-box {
      color: var(--bright);
      line-height: 1.5;
    }

    @media (max-width: 720px) {
      .layout { grid-template-columns: 1fr; }
      .status { justify-content: flex-start; }
      .stats { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="game">
    <header class="topbar">
      <div class="title-block">
        <span class="site-mark"></span>
        <h1>Click Lab</h1>
      </div>
      <div class="status">
        <div class="badge" id="energyDisplay">Energy: 0</div>
        <div class="badge" id="multiplierDisplay">x1.00</div>
      </div>
    </header>

    <div class="layout">
      <section class="panel">
        <div class="panel-head">
          <h2>Generator</h2>
          <span class="muted">System online</span>
        </div>

        <div class="click-area">
          <button class="main-button" id="collectButton" aria-label="Collect energy">Collect</button>
        </div>

        <div class="stats">
          <div class="stat">
            <div class="stat-label">Total clicks</div>
            <div class="stat-value" id="clicksDisplay">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">Per second</div>
            <div class="stat-value" id="autoDisplay">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">Click level</div>
            <div class="stat-value" id="clickLevelDisplay">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">Auto level</div>
            <div class="stat-value" id="autoLevelDisplay">0</div>
          </div>
        </div>
      </section>

      <aside class="panel">
        <div class="shop">
          <h2>Upgrades</h2>

          <div class="shop-item">
            <div>
              <h3>Stronger click</h3>
              <p id="clickUpgradeInfo">Cost: 15</p>
            </div>
            <button class="buy" id="buyClickUpgrade">Buy</button>
          </div>

          <div class="shop-item">
            <div>
              <h3>Auto collector</h3>
              <p id="autoUpgradeInfo">Cost: 30</p>
            </div>
            <button class="buy" id="buyAutoUpgrade">Buy</button>
          </div>

          <div class="shop-item">
            <div>
              <h3>Boost</h3>
              <p>Double output for 10 seconds</p>
            </div>
            <button class="buy" id="buyBoost">Boost</button>
          </div>
        </div>

        <div class="info">
          <h2>Lab status</h2>
          <div class="info-box" id="statusText">Machines are standing by. Start generating energy.</div>
        </div>

        <button class="reset" id="resetButton">Reset progress</button>
      </aside>
    </div>
  </div>

  <script>
    'use strict';
    const STORAGE_KEY = 'click-lab-save';
    const MAX_MULTIPLIER = 100;
    const defaultState = {
      energy: 0,
      totalClicks: 0,
      clickLevel: 0,
      autoLevel: 0,
      boostUntil: 0,
      lastTick: Date.now()
    };

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (!saved || typeof saved !== 'object') return { ...defaultState };
        return {
          energy: Number.isFinite(saved.energy) && saved.energy >= 0 ? saved.energy : 0,
          totalClicks: Number.isSafeInteger(saved.totalClicks) && saved.totalClicks >= 0 ? saved.totalClicks : 0,
          clickLevel: Number.isSafeInteger(saved.clickLevel) && saved.clickLevel >= 0 ? saved.clickLevel : 0,
          autoLevel: Number.isSafeInteger(saved.autoLevel) && saved.autoLevel >= 0 ? saved.autoLevel : 0,
          boostUntil: Number.isFinite(saved.boostUntil) ? saved.boostUntil : 0,
          lastTick: Date.now()
        };
      } catch (error) {
        return { ...defaultState };
      }
    }

    let state = loadState();
    const $ = (id) => document.getElementById(id);
    const els = {
      energy: $('energyDisplay'),
      multiplier: $('multiplierDisplay'),
      clicks: $('clicksDisplay'),
      auto: $('autoDisplay'),
      clickLevel: $('clickLevelDisplay'),
      autoLevel: $('autoLevelDisplay'),
      clickInfo: $('clickUpgradeInfo'),
      autoInfo: $('autoUpgradeInfo'),
      status: $('statusText'),
      buyClick: $('buyClickUpgrade'),
      buyAuto: $('buyAutoUpgrade'),
      buyBoost: $('buyBoost'),
      collect: $('collectButton'),
      reset: $('resetButton')
    };

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, lastTick: Date.now() }));
      } catch (error) {
        els.status.textContent = 'Saving is unavailable in this browser.';
      }
    }

    function permanentClickPower() {
      return Math.min(MAX_MULTIPLIER, 1 + state.clickLevel * 1.55);
    }

    function boostActive() {
      return Date.now() < state.boostUntil;
    }

    function clickPower() {
      return Math.min(MAX_MULTIPLIER, permanentClickPower() * (boostActive() ? 2 : 1));
    }

    function autoPower() {
      return state.autoLevel * (boostActive() ? 2 : 1);
    }

    function clickUpgradeCost() {
      return Math.floor(15 * Math.pow(1.7, state.clickLevel));
    }

    function autoUpgradeCost() {
      return Math.floor(30 * Math.pow(1.75, state.autoLevel));
    }

    function formatNumber(value) {
      if (value >= 1e9) return (value / 1e9).toFixed(2) + 'B';
      if (value >= 1e6) return (value / 1e6).toFixed(2) + 'M';
      if (value >= 1e3) return (value / 1e3).toFixed(2) + 'K';
      return value.toFixed(value >= 10 ? 0 : 2);
    }

    function updateUI() {
      const power = clickPower();
      const rate = autoPower();
      const atCap = permanentClickPower() >= MAX_MULTIPLIER;
      const boostText = boostActive() ? 'Boost active for ' + Math.max(0, Math.ceil((state.boostUntil - Date.now()) / 1000)) + 's' : 'No boost';

      els.energy.textContent = 'Energy: ' + formatNumber(state.energy);
      els.multiplier.textContent = 'x' + power.toFixed(2) + (atCap ? ' MAX' : '');
      els.clicks.textContent = formatNumber(state.totalClicks);
      els.auto.textContent = formatNumber(rate);
      els.clickLevel.textContent = String(state.clickLevel);
      els.autoLevel.textContent = String(state.autoLevel);
      els.clickInfo.textContent = atCap ? 'Maximum multiplier reached (x100)' : 'Cost: ' + formatNumber(clickUpgradeCost());
      els.autoInfo.textContent = 'Cost: ' + formatNumber(autoUpgradeCost());
      els.buyClick.disabled = state.energy < clickUpgradeCost() || atCap;
      els.buyClick.textContent = atCap ? 'Max' : 'Buy';
      els.buyAuto.disabled = state.energy < autoUpgradeCost();
      els.buyBoost.disabled = state.energy < 50;
      els.status.textContent = boostText + ' • Click power: ' + power.toFixed(2) + ' / ' + MAX_MULTIPLIER + ' • Auto generation: ' + rate.toFixed(2) + '/s';
    }

    function collectEnergy() {
      state.energy += clickPower();
      state.totalClicks += 1;
      updateUI();
      saveState();
    }

    function buyClickUpgrade() {
      const cost = clickUpgradeCost();
      if (state.energy < cost || permanentClickPower() >= MAX_MULTIPLIER) return;
      state.energy -= cost;
      state.clickLevel += 1;
      updateUI();
      saveState();
    }

    function buyAutoUpgrade() {
      const cost = autoUpgradeCost();
      if (state.energy < cost) return;
      state.energy -= cost;
      state.autoLevel += 1;
      updateUI();
      saveState();
    }

    function buyBoost() {
      if (state.energy < 50) return;
      state.energy -= 50;
      state.boostUntil = Date.now() + 10000;
      updateUI();
      saveState();
    }

    function tick() {
      const now = Date.now();
      const elapsed = Math.max(0, Math.min(1, (now - state.lastTick) / 1000));
      state.lastTick = now;
      if (state.autoLevel > 0) {
        state.energy += autoPower() * elapsed;
      }
      updateUI();
      saveState();
    }

    function resetGame() {
      if (!window.confirm('Reset all progress?')) return;
      state = { ...defaultState, lastTick: Date.now() };
      updateUI();
      saveState();
    }

    els.collect.addEventListener('click', collectEnergy);
    els.buyClick.addEventListener('click', buyClickUpgrade);
    els.buyAuto.addEventListener('click', buyAutoUpgrade);
    els.buyBoost.addEventListener('click', buyBoost);
    els.reset.addEventListener('click', resetGame);

    updateUI();
    setInterval(tick, 200);
  </script>
</body>
</html>
