<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Click Lab</title>
  <style>
    :root{--bg:#0f172a;--panel:#111827;--panel2:#1f2937;--text:#e5e7eb;--muted:#94a3b8;--shadow:rgba(0,0,0,.25)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#1e293b,var(--bg));color:var(--text);font-family:Arial,Helvetica,sans-serif}
    .game{width:min(820px,92vw);background:rgba(17,24,39,.95);border:1px solid rgba(148,163,184,.2);border-radius:18px;box-shadow:0 18px 40px var(--shadow);padding:22px}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}h1{margin:0;font-size:clamp(1.8rem,4vw,2.8rem)}.status{display:flex;gap:12px;flex-wrap:wrap}.badge{background:var(--panel2);border:1px solid rgba(148,163,184,.2);border-radius:999px;padding:8px 12px;font-weight:700}
    .layout{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.panel{background:rgba(31,41,55,.85);border:1px solid rgba(148,163,184,.18);border-radius:16px;padding:16px}.click-area{display:grid;place-items:center;min-height:300px;background:linear-gradient(135deg,rgba(56,189,248,.12),rgba(34,197,94,.08));border:1px solid rgba(56,189,248,.3);border-radius:18px;margin-bottom:14px}
    .main-button{border:0;border-radius:50%;width:180px;height:180px;font-size:1.8rem;font-weight:800;cursor:pointer;color:#03111c;background:linear-gradient(135deg,#7dd3fc,#4ade80);box-shadow:0 12px 24px rgba(56,189,248,.4);transition:transform .08s}.main-button:hover{transform:translateY(-2px) scale(1.02)}.main-button:active{transform:scale(.96)}
    .stats{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:12px;margin-top:12px}.stat,.shop-item,.info-box{background:rgba(15,23,42,.85);border:1px solid rgba(148,163,184,.18);border-radius:12px;padding:12px 14px}.stat-label{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.stat-value{margin-top:10px;font-size:1.4rem;font-weight:800}.shop h2,.info h2{margin:0 0 12px;font-size:1.2rem}.shop-item{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.shop-item h3{margin:0 0 5px;font-size:1rem}.shop-item p{margin:0;color:var(--muted);font-size:.9rem}
    button.buy,button.reset{border:0;color:#fff;border-radius:10px;font-size:.9rem;font-weight:700;padding:10px 14px;cursor:pointer}.buy{background:linear-gradient(135deg,#f59e0b,#f97316)}button.buy:disabled{opacity:.45;cursor:not-allowed}.reset{background:linear-gradient(135deg,#ef4444,#b91c1c);margin-top:12px}.info-box{margin-bottom:10px}.muted{color:var(--muted)}
    @media(max-width:720px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <main class="game">
    <header class="topbar"><h1>Click Lab</h1><div class="status"><div class="badge" id="energyDisplay">Energy: 0</div><div class="badge" id="multiplierDisplay">x1.00</div></div></header>
    <div class="layout">
      <section class="panel">
        <div class="click-area"><button class="main-button" id="collectButton" aria-label="Collect energy">Collect</button></div>
        <div class="stats">
          <div class="stat"><div class="stat-label">Total clicks</div><div class="stat-value" id="clicksDisplay">0</div></div>
          <div class="stat"><div class="stat-label">Per second</div><div class="stat-value" id="autoDisplay">0</div></div>
          <div class="stat"><div class="stat-label">Click level</div><div class="stat-value" id="clickLevelDisplay">0</div></div>
          <div class="stat"><div class="stat-label">Auto level</div><div class="stat-value" id="autoLevelDisplay">0</div></div>
        </div>
      </section>
      <aside class="panel">
        <div class="shop"><h2>Upgrades</h2>
          <div class="shop-item"><div><h3>Stronger click</h3><p id="clickUpgradeInfo">Cost: 15</p></div><button class="buy" id="buyClickUpgrade">Buy</button></div>
          <div class="shop-item"><div><h3>Auto collector</h3><p id="autoUpgradeInfo">Cost: 30</p></div><button class="buy" id="buyAutoUpgrade">Buy</button></div>
          <div class="shop-item"><div><h3>Boost</h3><p>Double output for 10 seconds</p></div><button class="buy" id="buyBoost">Boost</button></div>
        </div>
        <div class="info"><h2>Lab status</h2><div class="info-box" id="statusText">Machines are standing by. Start generating energy.</div></div>
        <button class="reset" id="resetButton">Reset progress</button>
      </aside>
    </div>
  </main>
  <script>
    'use strict';
    const STORAGE_KEY = 'click-lab-save';
    const MAX_MULTIPLIER = 100;
    const defaultState = {energy:0,totalClicks:0,clickLevel:0,autoLevel:0,boostUntil:0,lastTick:Date.now()};

    function loadState(){
      try{
        const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
        if(!saved||typeof saved!=='object')return {...defaultState};
        return {
          energy:Number.isFinite(saved.energy)&&saved.energy>=0?saved.energy:0,
          totalClicks:Number.isSafeInteger(saved.totalClicks)&&saved.totalClicks>=0?saved.totalClicks:0,
          clickLevel:Number.isSafeInteger(saved.clickLevel)&&saved.clickLevel>=0?saved.clickLevel:0,
          autoLevel:Number.isSafeInteger(saved.autoLevel)&&saved.autoLevel>=0?saved.autoLevel:0,
          boostUntil:Number.isFinite(saved.boostUntil)?saved.boostUntil:0,
          lastTick:Date.now()
        };
      }catch(error){return {...defaultState};}
    }
    let state=loadState();
    const $=id=>document.getElementById(id);
    const els={energy:$('energyDisplay'),multiplier:$('multiplierDisplay'),clicks:$('clicksDisplay'),auto:$('autoDisplay'),clickLevel:$('clickLevelDisplay'),autoLevel:$('autoLevelDisplay'),clickInfo:$('clickUpgradeInfo'),autoInfo:$('autoUpgradeInfo'),status:$('statusText'),buyClick:$('buyClickUpgrade'),buyAuto:$('buyAutoUpgrade'),buyBoost:$('buyBoost'),collect:$('collectButton'),reset:$('resetButton')};

    function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({...state,lastTick:Date.now()}));}catch(error){els.status.textContent='Saving is unavailable in this browser.';}}
    function permanentClickPower(){return Math.min(MAX_MULTIPLIER,1+state.clickLevel*1.55);}
    function clickPower(){return Math.min(MAX_MULTIPLIER,permanentClickPower()*(boostActive()?2:1));}
    function autoPower(){return state.autoLevel*(boostActive()?2:1);}
    function boostActive(){return Date.now()<state.boostUntil;}
    function clickUpgradeCost(){return Math.floor(15*Math.pow(1.7,state.clickLevel));}
    function autoUpgradeCost(){return Math.floor(30*Math.pow(1.75,state.autoLevel));}
    function formatNumber(value){if(value>=1e9)return (value/1e9).toFixed(2)+'B';if(value>=1e6)return (value/1e6).toFixed(2)+'M';if(value>=1e3)return (value/1e3).toFixed(2)+'K';return value.toFixed(value>=10?0:2);}

    function updateUI(){
      const power=clickPower(),rate=autoPower(),atCap=permanentClickPower()>=MAX_MULTIPLIER;
      const boostText=boostActive()?'Boost active for '+Math.max(0,Math.ceil((state.boostUntil-Date.now())/1000))+'s':'No boost';
      els.energy.textContent='Energy: '+formatNumber(state.energy);
      els.multiplier.textContent='x'+power.toFixed(2)+(atCap?' MAX':'');
      els.clicks.textContent=formatNumber(state.totalClicks);els.auto.textContent=formatNumber(rate);
      els.clickLevel.textContent=String(state.clickLevel);els.autoLevel.textContent=String(state.autoLevel);
      els.clickInfo.textContent=atCap?'Maximum multiplier reached (x100)':'Cost: '+formatNumber(clickUpgradeCost());
      els.autoInfo.textContent='Cost: '+formatNumber(autoUpgradeCost());
      els.buyClick.disabled=state.energy<clickUpgradeCost()||atCap;
      els.buyClick.textContent=atCap?'Max':'Buy';
      els.buyAuto.disabled=state.energy<autoUpgradeCost();els.buyBoost.disabled=state.energy<50;
      els.status.textContent=boostText+' • Click power: '+power.toFixed(2)+' / '+MAX_MULTIPLIER+' • Auto generation: '+rate.toFixed(2)+'/s';
    }
    function collectEnergy(){state.energy+=clickPower();state.totalClicks++;updateUI();saveState();}
    function buyClickUpgrade(){const cost=clickUpgradeCost();if(state.energy<cost||permanentClickPower()>=MAX_MULTIPLIER)return;state.energy-=cost;state.clickLevel++;updateUI();saveState();}
    function buyAutoUpgrade(){const cost=autoUpgradeCost();if(state.energy<cost)return;state.energy-=cost;state.autoLevel++;updateUI();saveState();}
    function buyBoost(){if(state.energy<50)return;state.energy-=50;state.boostUntil=Date.now()+10000;updateUI();saveState();}
    function tick(){const now=Date.now(),elapsed=Math.max(0,Math.min(1,(now-state.lastTick)/1000));state.lastTick=now;if(state.autoLevel>0)state.energy+=autoPower()*elapsed;updateUI();saveState();}
    function resetGame(){if(!window.confirm('Reset all progress?'))return;state={...defaultState,lastTick:Date.now()};updateUI();saveState();}
    els.collect.addEventListener('click',collectEnergy);els.buyClick.addEventListener('click',buyClickUpgrade);els.buyAuto.addEventListener('click',buyAutoUpgrade);els.buyBoost.addEventListener('click',buyBoost);els.reset.addEventListener('click',resetGame);
    updateUI();setInterval(tick,200);
  </script>
</body>
</html>
