<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Click Lab</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --danger: #ef4444;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --shadow: rgba(0, 0, 0, 0.25);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .game {
      width: min(820px, 92vw);
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 18px;
      box-shadow: 0 18px 40px var(--shadow);
      padding: 22px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
    }

    .status {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .badge {
      background: var(--panel-2);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 18px;
    }

    .panel {
      background: rgba(31, 41, 55, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 16px;
      padding: 16px;
    }

    .click-area {
      display: grid;
      place-items: center;
      min-height: 300px;
      background: linear-gradient(135deg, rgba(56,189,248,0.12), rgba(34,197,94,0.08));
      border: 1px solid rgba(56,189,248,0.3);
      border-radius: 18px;
      margin-bottom: 14px;
    }

    .main-button {
      border: none;
      border-radius: 50%;
      width: 180px;
      height: 180px;
      font-size: 1.8rem;
      font-weight: 800;
      cursor: pointer;
      color: #03111c;
      background: linear-gradient(135deg, #7dd3fc, #4ade80);
      box-shadow: 0 12px 24px rgba(56, 189, 248, 0.4);
      transition: transform 0.08s ease, box-shadow 0.12s ease;
    }

    .main-button:hover { transform: translateY(-2px) scale(1.02); }
    .main-button:active { transform: scale(0.96); }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(120px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .stat {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .stat-value {
      margin-top: 10px;
      font-size: 1.4rem;
      font-weight: 800;
    }

    .shop h2, .info h2 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 1.2rem;
    }

    .shop-item, .info-box {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .shop-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .shop-item h3 {
      margin: 0 0 5px;
      font-size: 1rem;
    }

    .shop-item p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    button.buy {
      border: none;
      background: linear-gradient(135deg, #f59e0b, #f97316);
      color: white;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 10px 14px;
      cursor: pointer;
    }

    button.buy:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button.reset {
      border: none;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: white;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 10px 14px;
      cursor: pointer;
      margin-top: 12px;
    }

    .muted {
      color: var(--muted);
    }

    @media (max-width: 720px) {
      .layout { grid-template-columns: 1fr; }
      .status { justify-content: flex-start; }
      .stats { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="game">
    <div class="topbar">
      <h1>Click Lab</h1>
      <div class="status">
        <div class="badge" id="energyDisplay">Energy: 0</div>
        <div class="badge" id="multiplierDisplay">x1.00</div>
      </div>
    </div>

    <div class="layout">
      <section class="panel main">
        <div class="click-area">
          <button class="main-button" id="collectButton" aria-label="Collect energy">Collect</button>
        </div>

        <div class="stats">
          <div class="stat">
            <div class="stat-label">Total clicks</div>
            <div class="stat-value" id="clicksDisplay">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">Per second</div>
            <div class="stat-value" id="autoDisplay">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">Click level</div>
            <div class="stat-value" id="clickLevelDisplay">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">Auto level</div>
            <div class="stat-value" id="autoLevelDisplay">0</div>
          </div>
        </div>
      </section>

      <aside class="panel sidebar">
        <div class="shop">
          <h2>Upgrades</h2>

          <div class="shop-item">
            <div>
              <h3>Stronger click</h3>
              <p id="clickUpgradeInfo">Cost: 15</p>
            </div>
            <button class="buy" id="buyClickUpgrade">Buy</button>
          </div>

          <div class="shop-item">
            <div>
              <h3>Auto collector</h3>
              <p id="autoUpgradeInfo">Cost: 30</p>
            </div>
            <button class="buy" id="buyAutoUpgrade">Buy</button>
          </div>

          <div class="shop-item">
            <div>
              <h3>Boost</h3>
              <p>Double output for 10 seconds</p>
            </div>
            <button class="buy" id="buyBoost">Boost</button>
          </div>
        </div>

        <div class="info">
          <h2>Lab status</h2>
          <div class="info-box" id="statusText">
            Machines are standing by. Start generating energy.
          </div>
        </div>

        <button class="reset" id="resetButton">Reset progress</button>
      </aside>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'click-lab-save';

    const defaultState = {
      energy: 0,
      totalClicks: 0,
      clickLevel: 0,
      autoLevel: 0,
      boostUntil: 0,
      lastTick: Date.now()
    };

    let state = loadState();

    const els = {
      energyDisplay: document.getElementById('energyDisplay'),
      multiplierDisplay: document.getElementById('multiplierDisplay'),
      clicksDisplay: document.getElementById('clicksDisplay'),
      autoDisplay: document.getElementById('autoDisplay'),
      clickLevelDisplay: document.getElementById('clickLevelDisplay'),
      autoLevelDisplay: document.getElementById('autoLevelDisplay'),
      clickUpgradeInfo: document.getElementById('clickUpgradeInfo'),
      autoUpgradeInfo: document.getElementById('autoUpgradeInfo'),
      statusText: document.getElementById('statusText'),
      buyClickUpgrade: document.getElementById('buyClickUpgrade'),
      buyAutoUpgrade: document.getElementById('buyAutoUpgrade'),
      buyBoost: document.getElementById('buyBoost'),
      collectButton: document.getElementById('collectButton'),
      resetButton: document.getElementById('resetButton')
    };

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        ...state,
        lastTick: Date.now()
      }));
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (!saved) return { ...defaultState };
        return {
          ...defaultState,
          ...saved,
          lastTick: Date.now()
        };
      } catch (error) {
        return { ...defaultState };
      }
    }

    function clickPower() {
      let base = 1 + state.clickLevel * 1.55;
      if (boostActive()) base *= 2;
      return base;
    }

    function autoPower() {
      return state.autoLevel * (boostActive() ? 2 : 1);
    }

    function boostActive() {
      return Date.now() < state.boostUntil;
    }

    function clickUpgradeCost() {
      return Math.floor(15 * Math.pow(1.7, state.clickLevel));
    }

    function autoUpgradeCost() {
      return Math.floor(30 * Math.pow(1.75, state.autoLevel));
    }

    function formatNumber(value) {
      if (value >= 1000000) return (value / 1000000).toFixed(2) + 'M';
      if (value >= 1000) return (value / 1000).toFixed(2) + 'K';
      return value.toFixed(value >= 10 ? 0 : 2);
    }

    function updateUI() {
      const clickMult = clickPower();
      const autoRate = autoPower();
      const boostText = boostActive() ? 'Boost active for ' + Math.max(0, Math.ceil((state.boostUntil - Date.now()) / 1000)) + 's' : 'No boost';

      els.energyDisplay.textContent = 'Energy: ' + formatNumber(state.energy);
      els.multiplierDisplay.textContent = 'x' + clickMult.toFixed(2);
      els.clicksDisplay.textContent = formatNumber(state.totalClicks);
      els.autoDisplay.textContent = formatNumber(autoRate);
      els.clickLevelDisplay.textContent = String(state.clickLevel);
      els.autoLevelDisplay.textContent = String(state.autoLevel);
      els.clickUpgradeInfo.textContent = 'Cost: ' + formatNumber(clickUpgradeCost());
      els.autoUpgradeInfo.textContent = 'Cost: ' + formatNumber(autoUpgradeCost());
      els.buyClickUpgrade.disabled = state.energy < clickUpgradeCost();
      els.buyAutoUpgrade.disabled = state.energy < autoUpgradeCost();
      els.buyBoost.disabled = state.energy < 50;

      els.statusText.textContent = boostText + ' • Click power: ' + clickMult.toFixed(2) + ' • Auto generation: ' + autoRate.toFixed(2) + '/s';
    }

    function collectEnergy() {
      const gain = clickPower();
      state.energy += gain;
      state.totalClicks += 1;
      updateUI();
      saveState();
    }

    function buyClickUpgrade() {
      const cost = clickUpgradeCost();
      if (state.energy < cost) return;
      state.energy -= cost;
      state.clickLevel += 1;
      updateUI();
      saveState();
    }

    function buyAutoUpgrade() {
      const cost = autoUpgradeCost();
      if (state.energy < cost) return;
      state.energy -= cost;
      state.autoLevel += 1;
      updateUI();
      saveState();
    }

    function buyBoost() {
      if (state.energy < 50) return;
      state.energy -= 50;
      state.boostUntil = Date.now() + 10000;
      updateUI();
      saveState();
    }

    function tick() {
      const now = Date.now();
      const elapsedSeconds = (now - state.lastTick) / 1000;
      state.lastTick = now;

      if (state.autoLevel > 0) {
        state.energy += autoPower() * elapsedSeconds;
      }

      updateUI();
      saveState();
    }

    function resetGame() {
      if (!window.confirm('Reset all progress?')) return;
      state = { ...defaultState, lastTick: Date.now() };
      updateUI();
      saveState();
    }

    els.collectButton.addEventListener('click', collectEnergy);
    els.buyClickUpgrade.addEventListener('click', buyClickUpgrade);
    els.buyAutoUpgrade.addEventListener('click', buyAutoUpgrade);
    els.buyBoost.addEventListener('click', buyBoost);
    els.resetButton.addEventListener('click', resetGame);

    updateUI();
    setInterval(tick, 200);
  </script>
</body>
</html>
